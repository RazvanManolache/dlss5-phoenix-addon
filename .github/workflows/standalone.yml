name: Standalone library
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - name: Configure standalone library
      if: runner.os != 'Windows'
      run: cmake -S native_runtime -B build/standalone -DCMAKE_BUILD_TYPE=Release
    - name: Configure Visual Studio library
      if: runner.os == 'Windows'
      run: cmake -S native_runtime -B build/standalone
    - name: Build library and compile Metal on macOS
      run: cmake --build build/standalone --config Release --parallel 4
    - name: Test portable components
        # Hosted macOS runners do not provide a certified Apple GPU test device.
      run: ctest --test-dir build/standalone -C Release --output-on-failure -E metal_operators
    - name: Test source integrity handling
      run: python -m unittest discover -s tests -p test_vulkan_import_integrity.py
    - name: Test exact and approximate shader capability boundaries
      run: python -m unittest discover -s tests -p test_vulkan_workgroup_spirv.py
    - name: Test Metal if an Apple GPU is exposed
      if: runner.os == 'macOS'
      run: python tools/test_metal_available.py build/standalone
    - name: Stage SDK
      run: cmake --install build/standalone --config Release --prefix build/sdk
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-sdk-${{ matrix.os }}
        BUILD_PATHS: build/sdk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
  android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android CLI
      run: |
        mkdir -p "$RUNNER_TEMP/android-cli"
        curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/android --output "$RUNNER_TEMP/android-cli/android"
        chmod +x "$RUNNER_TEMP/android-cli/android"
        echo "$RUNNER_TEMP/android-cli" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/android-cli/android" --no-metrics --version
    - name: Install pinned NDK
      run: android --no-metrics --sdk="$ANDROID_HOME" sdk install 'ndk/27.3.13750724' 'cmake/3.22.1'
    - name: Configure ARM64 library
      run: >-
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S native_runtime -B build/android -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared
        -DPHOENIX_ENABLE_METAL=OFF
    - name: Cross-compile ARM64
      run: |
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build/android --parallel 4
    - name: Stage SDK
      run: |
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --install build/android --prefix build/sdk
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-sdk-android-arm64
        BUILD_PATHS: build/sdk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
  vulkan:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android CLI
      run: |
        mkdir -p "$RUNNER_TEMP/android-cli"
        curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/android --output "$RUNNER_TEMP/android-cli/android"
        chmod +x "$RUNNER_TEMP/android-cli/android"
        echo "$RUNNER_TEMP/android-cli" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/android-cli/android" --no-metrics --version
    - run: android --no-metrics --sdk="$ANDROID_HOME" sdk install 'ndk/27.3.13750724' 'cmake/3.22.1'
    - run: sudo apt-get update -qq && sudo apt-get install -y libvulkan-dev ninja-build
    - uses: actions/checkout@v7.0.1
      with:
        repository: KhronosGroup/Vulkan-Headers
        ref: v1.4.365
        path: build/dependencies/headers
    - uses: actions/checkout@v7.0.1
      with:
        repository: KhronosGroup/glslang
        ref: 16.6.0
        path: build/dependencies/glslang
    - name: Prepare pinned glslang dependencies
      working-directory: build/dependencies/glslang
      run: python update_glslang_sources.py
    - name: Build host shader compiler
      run: |
        cmake -S build/dependencies/glslang -B build/glslang -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DENABLE_HLSL=OFF -DGLSLANG_TESTS=OFF
        cmake --build build/glslang --parallel 4
    - name: Build Linux Vulkan provider and run portable tests
      run: |
        cmake -S native_runtime -B build/linux-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOENIX_ENABLE_METAL=OFF -DPHOENIX_BUILD_LINUX_LAYER=ON -DPHOENIX_ENABLE_VULKAN=ON -DPHOENIX_VULKAN_HEADERS=$PWD/build/dependencies/headers/include -DPHOENIX_GLSLANG=$PWD/build/glslang/StandAlone/glslang
        cmake --build build/linux-vulkan --parallel 4
        ctest --test-dir build/linux-vulkan --output-on-failure
        cmake --install build/linux-vulkan --prefix build/sdk-linux-vulkan
    - name: Fetch pinned private CUDA build tools
      run: python tools/fetch_cuda_toolchain.py --output "$RUNNER_TEMP/cuda-13.1"
    - name: Build optional Linux CUDA executors without GPU execution
      run: |
        cmake -S native_runtime -B build/linux-vulkan -DPHOENIX_ENABLE_CUDA=ON -DPHOENIX_ENABLE_NATIVE_CUDA=ON -DCMAKE_CUDA_COMPILER="$RUNNER_TEMP/cuda-13.1/bin/nvcc" -DCMAKE_CUDA_ARCHITECTURES=120
        cmake --build build/linux-vulkan --parallel 4
        ctest --test-dir build/linux-vulkan --output-on-failure -R '^linux_'
        cmake --install build/linux-vulkan --prefix build/sdk-linux-vulkan
    - name: Verify relocatable Linux package without GPU execution
      run: |
        python tests/linux/test_package.py --prefix build/sdk-linux-vulkan --report artifacts/current/linux/VALIDATION.json
        python tools/package_linux.py --prefix build/sdk-linux-vulkan --output artifacts/current/linux --version 1.1.0
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-linux-x86_64-preview
        BUILD_PATHS: artifacts/current/linux
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - name: Cross-build Android Vulkan provider
      run: |
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S native_runtime -B build/android-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared -DPHOENIX_ENABLE_METAL=OFF -DPHOENIX_ENABLE_VULKAN=ON -DPHOENIX_VULKAN_HEADERS=$PWD/build/dependencies/headers/include -DPHOENIX_GLSLANG=$PWD/build/glslang/StandAlone/glslang
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build/android-vulkan --parallel 4
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --install build/android-vulkan --prefix build/sdk-android-vulkan
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-sdk-android-arm64-vulkan
        BUILD_PATHS: build/sdk-android-vulkan
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
